# Render Blueprint（https://render.com/docs/blueprint-spec）
# 手順は docs/deploy.md を参照
databases:
  - name: dokoiku-db
    plan: free
    region: singapore
    # 空にすると Render 内部（プライベートネットワーク）からの接続だけを許可する。
    # 省略するとインターネットのどこからでも接続できてしまう
    ipAllowList: []

services:
  - type: web
    name: dokoiku
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dokoiku-db
          property: connectionString
      # 値は Render のダッシュボードで入力する（手元の config/master.key の中身）
      - key: RAILS_MASTER_KEY
        sync: false
      # Solid Queue を Puma の中で動かす（ワーカー用のサービスを別に立てない）
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      # Thruster が待ち受けるポート（Render は PORT 番に通信を流す）
      - key: HTTP_PORT
        value: "10000"
      # Render に待受ポートを伝える。Puma 起動時は Thruster が TARGET_PORT(3000) で上書きする
      - key: PORT
        value: "10000"
